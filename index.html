<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Sitabutr bamrung School | ระบบบริการสารสนเทศสำหรับผู้ปกครอง</title>
  
  <!-- Viewport & Mobile Standalone (Zero-Defect Fullscreen) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B3B6F">
  
  <!-- Apple iOS Standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sitabutr bamrung School">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-">
  <link rel="apple-touch-icon-precomposed" href="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-">
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Early PWA Registration & Install Event Interception -->
  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-ready'));
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function(reg) {
          console.log('PWA Service Worker Registered Early:', reg.scope);
        })
        .catch(function(err) {
          console.warn('PWA SW Note:', err);
        });
    }
  </script>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100% !important;
      height: 100% !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: #0f172a !important;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Iframe Shell (100% Fullscreen Web App) */
    #app-frame {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      border: none;
      outline: none;
      display: block;
      background: #0f172a;
    }

    /* Loading Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1B3B6F 0%, #0d1b2a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-box {
      width: 100px;
      height: 100px;
      border-radius: 26px;
      background: #ffffff;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      animation: pulse 2.2s infinite ease-in-out;
      margin-bottom: 18px;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .splash-sub {
      font-size: 0.88rem;
      color: #93c5fd;
      margin-bottom: 22px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(147, 197, 253, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ==========================================================================
       POPUP ติดตั้งแอปแถวเดียวยาวสวยๆ (SINGLE-LINE FLOATING CAPSULE)
       ========================================================================== */
    #install-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      width: auto;
      max-width: calc(100vw - 28px);
      height: 52px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.8px solid #2563eb;
      border-radius: 999px;
      padding: 6px 12px 6px 14px;
      box-shadow: 0 14px 34px -4px rgba(37, 99, 235, 0.4), 0 4px 14px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100000;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      box-sizing: border-box;
    }

    #install-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      animation: sbbFloat 3.8s ease-in-out infinite 0.5s;
    }

    #install-banner.closing {
      opacity: 0 !important;
      transform: translateX(-50%) translateY(140px) !important;
      animation: none !important;
      transition: transform 0.35s cubic-bezier(0.4, 0, 1, 1), opacity 0.3s ease !important;
    }

    @keyframes sbbFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }

    .install-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #eff6ff;
      padding: 3px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .install-info {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .install-info h4 {
      font-size: 14px;
      font-weight: 700;
      color: #1B3B6F;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .install-btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 6px 15px;
      height: 36px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      font-family: inherit;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .install-btn:active {
      transform: scale(0.96);
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #475569;
    }

    /* ==========================================================================
       MODAL แนะนำการติดตั้งแยกตามอุปกรณ์ (Android Chrome & iOS Safari)
       ========================================================================== */
    .guide-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100002;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .guide-modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .guide-modal-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 24px 20px 30px 20px;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.28);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .guide-modal-backdrop.show .guide-modal-box {
      transform: translateY(0);
    }

    .guide-drag-handle {
      width: 40px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 999px;
      margin: 0 auto 16px auto;
    }

    .guide-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .guide-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .guide-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: #1B3B6F;
      line-height: 1.3;
    }

    .guide-header p {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .guide-steps-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .guide-step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 13.5px;
      color: #334155;
      line-height: 1.4;
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #1B3B6F;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-guide-close {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #1B3B6F 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    /* Standalone Mode: ซ่อนแถบติดตั้งอัตโนมัติ */
    @media all and (display-mode: standalone) {
      #install-banner,
      .guide-modal-backdrop {
        display: none !important;
      }
    }

    @media (max-width: 440px) {
      #install-banner {
        padding: 5px 8px 5px 10px;
        gap: 8px;
        height: 48px;
      }
      .install-icon {
        width: 28px;
        height: 28px;
      }
      .install-info h4 {
        font-size: 12.5px;
      }
      .install-btn {
        padding: 5px 11px;
        height: 32px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Loading Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo-box">
      <img src="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-" alt="Logo" class="splash-logo">
    </div>
    <div class="splash-title">Sitabutr bamrung School</div>
    <div class="splash-sub">ระบบบริการสารสนเทศสำหรับผู้ปกครอง</div>
    <div class="spinner"></div>
  </div>

  <!-- 2. Google Apps Script Embedded Iframe (Parent Portal Web App) -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbyGK_eolAztT7gsoRXav9pI9mIshNwvg2lLPmZ5zajsKRKsCGna4_KpCPwyZwo1YYb5Rg/exec?pwa_host=github"
    allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor; fullscreen"
    onload="hideSplash()"
    title="Sitabutr bamrung School Parent Portal"
  ></iframe>

  <!-- 3. Popup ติดตั้งแอปแถวเดียว ทรงแคปซูลยาว แนวนอน สไลด์ขึ้นมาจากด้านล่าง -->
  <div id="install-banner" onclick="handlePwaClick(event)">
    <img src="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-" alt="App Icon" class="install-icon">
    <div class="install-info">
      <h4>ติดตั้งแอป Sitabutr bamrung School</h4>
    </div>
    <button type="button" class="install-btn" id="btn-install">
      ติดตั้ง
    </button>
    <button type="button" class="close-btn" onclick="dismissBanner(event)" title="ปิด"><i class="fas fa-times"></i></button>
  </div>

  <!-- 4. Universal Installation Guide Modal (ฉลาดแยก Android Chrome / iOS Safari / In-App) -->
  <div id="install-guide-modal" class="guide-modal-backdrop" onclick="closeGuideModal(event)">
    <div class="guide-modal-box" onclick="event.stopPropagation()">
      <div class="guide-drag-handle"></div>
      
      <div class="guide-header">
        <div id="guide-icon-box" class="guide-icon-box">
          <i id="guide-icon" class="fa-brands fa-android"></i>
        </div>
        <div>
          <h3 id="guide-title">วิธีติดตั้งแอป Sitabutr bamrung School</h3>
          <p id="guide-subtitle">สร้างไอคอนลงบนหน้าจอมือถือเพื่อใช้งานสะดวกรวดเร็ว</p>
        </div>
      </div>

      <div id="guide-steps" class="guide-steps-list">
        <!-- Steps injected dynamically by JavaScript based on device -->
      </div>

      <button type="button" class="btn-guide-close" onclick="closeGuideModal()">
        เข้าใจแล้ว
      </button>
    </div>
  </div>

  <script>
    // 1. ซ่อนหน้า Splash เมื่อ Iframe โหลดเสร็จ
    function hideSplash() {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 600);
    }

    // Fallback ปิด Splash หลังจาก 3.5 วินาที
    setTimeout(hideSplash, 3500);

    // 2. ตรวจสอบการติดตั้งและอุปกรณ์
    let deferredPrompt = window.deferredPrompt || null;
    const installBanner = document.getElementById('install-banner');
    const guideModal = document.getElementById('install-guide-modal');

    const isIos = () => {
      const userAgent = (window.navigator.userAgent || '').toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent) && !window.MSStream;
    };

    const isAppInstalled = () => {
      const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || 
                           window.navigator.standalone === true;
      let isFlagged = false;
      try {
        isFlagged = localStorage.getItem('sbb_pwa_installed') === 'true';
      } catch (e) {}
      return isStandalone || isFlagged;
    };

    let bannerShown = false;
    let bannerTimer = null;

    function showBanner() {
      if (bannerShown || isAppInstalled()) return;
      if (installBanner) {
        bannerShown = true;
        installBanner.classList.remove('closing');
        installBanner.classList.add('show');
      }
    }

    function scheduleShowBanner(delay) {
      if (bannerShown || isAppInstalled() || bannerTimer) return;
      bannerTimer = setTimeout(() => {
        bannerTimer = null;
        showBanner();
      }, delay);
    }

    function slideDownBanner(callback) {
      if (!installBanner || !installBanner.classList.contains('show')) {
        if (callback) callback();
        return;
      }
      installBanner.classList.remove('show');
      installBanner.classList.add('closing');
      setTimeout(() => {
        installBanner.classList.remove('closing');
        if (callback) callback();
      }, 350);
    }

    function dismissBanner(event) {
      if (event) event.stopPropagation();
      slideDownBanner();
    }

    // จัดการ Event ติดตั้งแอป (Android Chrome / Desktop Edge / Samsung Internet)
    // Android: แถบขึ้นเฉพาะเมื่อ Chrome ส่ง beforeinstallprompt มา = ติดตั้งได้แน่นอน
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.deferredPrompt = e;
      if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
      scheduleShowBanner(800);
    });

    window.addEventListener('pwa-ready', () => {
      deferredPrompt = window.deferredPrompt || deferredPrompt;
      if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
      scheduleShowBanner(800);
    });

    if (!isAppInstalled()) {
      if (isIos()) {
        // iOS Safari: แสดงแถบเสมอ (ไม่มี beforeinstallprompt บน iOS)
        scheduleShowBanner(1500);
      }
      // Android: ไม่ตั้ง timer ที่นี่ — รอ beforeinstallprompt เท่านั้น
      // ถ้า Chrome ไม่ยิง beforeinstallprompt = Chrome ยังไม่พร้อม → ไม่แสดงแถบดีกว่า
    }

    // ดักจับเมื่อผู้ใช้ติดตั้งสำเร็จ
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      window.deferredPrompt = null;
      try {
        localStorage.setItem('sbb_pwa_installed', 'true');
      } catch (e) {}
      slideDownBanner();
    });

    // แสดง Modal แนะนำขั้นตอนอย่างถูกต้องตามระบบปฏิบัติการ (Android vs iOS vs In-App)
    function showGuideModal(type) {
      const icon = document.getElementById('guide-icon');
      const title = document.getElementById('guide-title');
      const subtitle = document.getElementById('guide-subtitle');
      const stepsList = document.getElementById('guide-steps');
      if (!guideModal || !stepsList) return;

      if (type === 'ios') {
        icon.className = 'fa-brands fa-apple';
        icon.style.color = '#1B3B6F';
        title.innerText = 'วิธีติดตั้งแอปบน iPhone / iPad (Safari)';
        subtitle.innerText = 'เพิ่มลงในหน้าจอโฮมเพื่อเปิดใช้งานได้ใน 1 วินาที';
        stepsList.innerHTML = `
          <div class="guide-step-item">
            <div class="step-num">1</div>
            <div>แตะปุ่ม <strong>แชร์ (Share)</strong> <i class="fa-solid fa-arrow-up-from-bracket" style="color:#0284c7;"></i> ที่แถบล่างสุดของ Safari</div>
          </div>
          <div class="guide-step-item">
            <div class="step-num">2</div>
            <div>เลื่อนลงมาแล้วเลือก <strong>"เพิ่มไปยังหน้าจอโฮม" (Add to Home Screen)</strong></div>
          </div>
          <div class="guide-step-item">
            <div class="step-num">3</div>
            <div>แตะคำว่า <strong>"เพิ่ม" (Add)</strong> มุมบนขวา จะได้ไอคอนแอปทันที</div>
          </div>
        `;
      } else if (type === 'inapp') {
        icon.className = 'fa-solid fa-arrow-up-right-from-square';
        icon.style.color = '#0284c7';
        title.innerText = 'กรุณาเปิดในเบราว์เซอร์ภายนอก (Chrome)';
        subtitle.innerText = 'แอป LINE / Facebook ไม่อนุญาตให้ติดตั้ง PWA โดยตรง';
        stepsList.innerHTML = `
          <div class="guide-step-item">
            <div class="step-num">1</div>
            <div>แตะที่เมนู <strong>จุด 3 จุด ( ⋮ หรือ ⋯ )</strong> ที่มุมหน้าจอ</div>
          </div>
          <div class="guide-step-item">
            <div class="step-num">2</div>
            <div>เลือก <strong>"เปิดในเบราว์เซอร์เริ่มต้น"</strong> (Open in external browser)</div>
          </div>
          <div class="guide-step-item">
            <div class="step-num">3</div>
            <div>เมื่อเปิดใน Chrome แล้ว ให้แตะปุ่ม <strong>"ติดตั้ง"</strong> ได้ทันทีครับ</div>
          </div>
        `;
      } else {
        // Android (Google Chrome)
        icon.className = 'fa-brands fa-android';
        icon.style.color = '#16a34a';
        title.innerText = 'วิธีติดตั้งแอปบน Android (Google Chrome)';
        subtitle.innerText = 'สร้างไอคอน Sitabutr bamrung School บนหน้าจอมือถือ';
        stepsList.innerHTML = `
          <div class="guide-step-item">
            <div class="step-num">1</div>
            <div>แตะที่เมนู <strong>จุด 3 จุดแนวตั้ง ( ⋮ )</strong> ที่มุมบนขวาของ Google Chrome</div>
          </div>
          <div class="guide-step-item">
            <div class="step-num">2</div>
            <div>มองหาและเลือกเมนู <strong>"ติดตั้งแอป" (Install app)</strong> หรือ <strong>"เพิ่มลงในหน้าจอหลัก"</strong></div>
          </div>
          <div class="guide-step-item">
            <div class="step-num">3</div>
            <div>กดยืนยันคำว่า <strong>"ติดตั้ง"</strong> ไอคอนโรงเรียนจะไปอยู่ที่หน้าจอมือถือทันที!</div>
          </div>
        `;
      }

      guideModal.classList.add('show');
    }

    function closeGuideModal(event) {
      if (guideModal) guideModal.classList.remove('show');
    }

    // เมื่อกดปุ่ม "ติดตั้ง" บนแถบ Floating Pill
    async function handlePwaClick(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      // In-App Browser (LINE / Facebook / Instagram / Messenger) → แนะนำให้เปิด Chrome ก่อน
      const ua = (navigator.userAgent || '').toLowerCase();
      const isInApp = ua.includes('line') || ua.includes('fban') || ua.includes('fbav') ||
                      ua.includes('instagram') || ua.includes('messenger');
      if (isInApp) {
        slideDownBanner();
        showGuideModal('inapp');
        return;
      }

      // iOS Safari → แสดงคู่มือ Share > Add to Home Screen
      if (isIos()) {
        slideDownBanner();
        showGuideModal('ios');
        return;
      }

      // Android / Chrome / Edge / Samsung:
      // แถบขึ้นมาได้ก็ต่อเมื่อ beforeinstallprompt พร้อมแล้ว → เรียก prompt() ทันที
      const promptEvent = deferredPrompt || window.deferredPrompt;
      if (promptEvent) {
        deferredPrompt = null;
        window.deferredPrompt = null;
        try {
          promptEvent.prompt();
          const choiceResult = await promptEvent.userChoice;
          if (choiceResult && choiceResult.outcome === 'accepted') {
            try { localStorage.setItem('sbb_pwa_installed', 'true'); } catch (err) {}
            slideDownBanner();
          }
        } catch (err) {
          console.warn('Install prompt error:', err);
          slideDownBanner();
        }
      } else {
        // กรณีไม่น่าเกิด: แถบขึ้นมาแต่ prompt หายไปแล้ว → ปิดแถบเฉยๆ
        slideDownBanner();
      }
    }
  </script>
</body>
