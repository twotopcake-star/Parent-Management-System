<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Sitabutr bamrung School | ระบบบริการสารสนเทศสำหรับผู้ปกครอง</title>
  
  <!-- Viewport & Mobile Standalone (Zero-Defect Fullscreen) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B3B6F">
  
  <!-- Apple iOS Standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sitabutr bamrung School">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-">
  <link rel="apple-touch-icon-precomposed" href="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-">
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100% !important;
      height: 100% !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: #0f172a !important;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Iframe Shell (100% Fullscreen Web App) */
    #app-frame {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      border: none;
      outline: none;
      display: block;
      background: #0f172a;
    }

    /* Loading Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1B3B6F 0%, #0d1b2a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-box {
      width: 100px;
      height: 100px;
      border-radius: 26px;
      background: #ffffff;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      animation: pulse 2.2s infinite ease-in-out;
      margin-bottom: 18px;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .splash-sub {
      font-size: 0.88rem;
      color: #93c5fd;
      margin-bottom: 22px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(147, 197, 253, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ==========================================================================
       POPUP ติดตั้งแอปแถวเดียวยาวสวยๆ (SINGLE-LINE FLOATING CAPSULE)
       ========================================================================== */
    #install-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      width: auto;
      max-width: calc(100vw - 28px);
      height: 52px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.8px solid #2563eb;
      border-radius: 999px;
      padding: 6px 12px 6px 14px;
      box-shadow: 0 14px 34px -4px rgba(37, 99, 235, 0.4), 0 4px 14px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100000;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
      box-sizing: border-box;
    }

    #install-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      animation: sbbFloat 3.8s ease-in-out infinite 0.5s;
    }

    #install-banner.closing {
      opacity: 0 !important;
      transform: translateX(-50%) translateY(140px) !important;
      animation: none !important;
      transition: transform 0.35s cubic-bezier(0.4, 0, 1, 1), opacity 0.3s ease !important;
    }

    @keyframes sbbFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }

    .install-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: contain;
      background: #eff6ff;
      padding: 3px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .install-info {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .install-info h4 {
      font-size: 14px;
      font-weight: 700;
      color: #1B3B6F;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .install-btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      height: 36px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      font-family: inherit;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .install-btn:active {
      transform: scale(0.96);
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #475569;
    }

    /* iOS Guide Prompt */
    #ios-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      z-index: 100001;
      display: none;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    #ios-prompt.show {
      display: block;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(50px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* Standalone Mode: ซ่อนแถบติดตั้งอัตโนมัติ */
    @media all and (display-mode: standalone) {
      #install-banner,
      #ios-prompt {
        display: none !important;
      }
    }

    @media (max-width: 440px) {
      #install-banner {
        padding: 5px 8px 5px 10px;
        gap: 8px;
        height: 48px;
      }
      .install-icon {
        width: 28px;
        height: 28px;
      }
      .install-info h4 {
        font-size: 12.5px;
      }
      .install-btn {
        padding: 5px 11px;
        height: 32px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Loading Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo-box">
      <img src="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-" alt="Logo" class="splash-logo">
    </div>
    <div class="splash-title">Sitabutr bamrung School</div>
    <div class="splash-sub">ระบบบริการสารสนเทศสำหรับผู้ปกครอง</div>
    <div class="spinner"></div>
  </div>

  <!-- 2. Google Apps Script Embedded Iframe (Parent Portal Web App) -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbyGK_eolAztT7gsoRXav9pI9mIshNwvg2lLPmZ5zajsKRKsCGna4_KpCPwyZwo1YYb5Rg/exec"
    allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor; fullscreen"
    onload="hideSplash()"
    title="Sitabutr bamrung School Parent Portal"
  ></iframe>

  <!-- 3. Popup ติดตั้งแอปแถวเดียว ทรงแคปซูลยาว แนวนอน สไลด์ขึ้นมาจากด้านล่าง -->
  <div id="install-banner" onclick="handlePwaClick()">
    <img src="https://lh3.googleusercontent.com/d/1xX85Kyhv36WJJ-0CS35mfKLdy0H0-YU-" alt="App Icon" class="install-icon">
    <div class="install-info">
      <h4>ติดตั้งแอป Sitabutr bamrung School</h4>
    </div>
    <button class="install-btn" id="btn-install">
      <i class="fas fa-bolt"></i> เร็ว &amp; เต็มจอ
    </button>
    <button type="button" class="close-btn" onclick="dismissBanner(event)" title="ปิด"><i class="fas fa-times"></i></button>
  </div>

  <!-- 4. iOS Add to Home Instruction -->
  <div id="ios-prompt">
    <div style="font-weight: 700; font-size: 1rem; color:#1B3B6F; margin-bottom: 8px;">📲 ติดตั้งแอปบน iPhone / iPad</div>
    <p style="font-size: 0.88rem; color: #475569; line-height: 1.5;">
      แตะปุ่มแชร์ <i class="fa-solid fa-arrow-up-from-bracket" style="color:#0284c7; font-size:1.05rem; padding:0 3px;"></i> ด้านล่างของ Safari<br>
      แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)"</b>
    </p>
    <button type="button" onclick="closeIosPrompt()" style="margin-top: 14px; background:#1B3B6F; color:#ffffff; border:none; padding:8px 20px; border-radius:10px; font-size:0.85rem; font-weight:600; cursor:pointer; font-family:inherit;">
      รับทราบ
    </button>
  </div>

  <script>
    // 1. ซ่อนหน้า Splash เมื่อ Iframe โหลดเสร็จ
    function hideSplash() {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 600);
    }

    // Fallback ปิด Splash หลังจาก 3.5 วินาที
    setTimeout(hideSplash, 3500);

    // 2. ลงทะเบียน Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker Registered:', reg.scope))
          .catch((err) => console.warn('PWA Service Worker Registration Note:', err));
      });
    }

    // 3. ตรวจสอบการติดตั้งและอุปกรณ์
    let deferredPrompt = null;
    const installBanner = document.getElementById('install-banner');
    const iosPrompt = document.getElementById('ios-prompt');

    const isIos = () => {
      const userAgent = (window.navigator.userAgent || '').toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent) && !window.MSStream;
    };

    const isAppInstalled = () => {
      const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || 
                           window.navigator.standalone === true;
      let isFlagged = false;
      try {
        isFlagged = localStorage.getItem('sbb_pwa_installed') === 'true';
      } catch (e) {}
      return isStandalone || isFlagged;
    };

    function showBanner() {
      if (isAppInstalled()) return;
      if (installBanner) {
        installBanner.classList.remove('closing');
        installBanner.classList.add('show');
      }
    }

    function slideDownBanner(callback) {
      if (!installBanner || !installBanner.classList.contains('show')) {
        if (callback) callback();
        return;
      }
      installBanner.classList.remove('show');
      installBanner.classList.add('closing');
      setTimeout(() => {
        installBanner.classList.remove('closing');
        if (callback) callback();
      }, 350);
    }

    function dismissBanner(event) {
      if (event) event.stopPropagation();
      slideDownBanner();
    }

    function closeIosPrompt() {
      if (iosPrompt) iosPrompt.classList.remove('show');
    }

    // จัดการ Event ติดตั้งแอป (Android Chrome / Desktop Edge)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(showBanner, 900);
    });

    if (!isAppInstalled()) {
      if (isIos()) {
        setTimeout(showBanner, 1200);
      } else {
        setTimeout(showBanner, 1500);
      }
    }

    // ดักจับเมื่อผู้ใช้ติดตั้งสำเร็จ
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      try {
        localStorage.setItem('sbb_pwa_installed', 'true');
      } catch (e) {}
      slideDownBanner();
    });

    // เมื่อกดคลิกที่แถบติดตั้ง
    function handlePwaClick() {
      slideDownBanner(async () => {
        try {
          localStorage.setItem('sbb_pwa_installed', 'true');
        } catch (e) {}

        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('User response to install prompt:', outcome);
          deferredPrompt = null;
        } else if (isIos()) {
          if (iosPrompt) iosPrompt.classList.add('show');
        } else {
          alert('กรุณาแตะเมนู 3 จุดของเบราว์เซอร์ แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มไปยังหน้าจอหลัก"');
        }
      });
    }
  </script>
</body>
</html>
